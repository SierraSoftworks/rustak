[package]
name = "rustak-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "Sidecar SDK: TAK stream client, typed Marti API client, control-API client. Also used by the server's integration tests."

[lints]
workspace = true

[features]
default = []
# The `stream::testing` fake EUD, used by `rustak-server`'s integration tests
# and the interop suites. Implies `insecure-tcp`, because a test harness that
# has no certificate authority still has to be able to reach a listener.
testing = ["insecure-tcp"]
# Allows plain-TCP connect strings (`tcp://host:port`, `host:port:tcp`).
# Off by default: rustak has no plaintext stream input, and a client that can
# be pointed at one is a client that can be downgraded.
insecure-tcp = []

[dependencies]
rustak-core = { workspace = true }
rustak-cot = { workspace = true }
rustak-api = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
# `query` on top of the workspace features: the Marti API puts almost everything
# in the query string, and building those by hand is how a repeated parameter
# ends up comma-joined. Features are additive, so this asks for one more rather
# than replacing the set.
reqwest = { workspace = true, features = ["query"] }
# Enrolment generates the sidecar's key pair and its signing request locally;
# the private half never leaves the process.
rcgen = { workspace = true }
# Reads back the certificate enrolment was issued, so that the start-up line can
# say whose it is and when it expires.
x509-parser = { workspace = true }
# Reads the `iss` out of this sidecar's *own* workload identity, so the start-up
# line can say who signed it. Nothing here verifies a signature: the server does
# that, and a client that pretended to would be a client that could be lied to.
base64 = { workspace = true }
futures = { workspace = true }
tokio-util = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
tracing = { workspace = true }
human-errors = { workspace = true }

[dev-dependencies]
# `test-util` is what `tokio::time::pause` needs; the keepalive timings are 15
# and 25 seconds and are not worth waiting for in a test suite.
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
rustls = { workspace = true }
# `feed`'s settings types are read out of a plugin's `[settings]` table, so the
# tests that hold them to `deny_unknown_fields` parse the TOML an operator
# writes rather than the JSON a fixture does.
toml = { workspace = true }
# The Marti and control clients are tested against a stub server rather than a
# real one: what they are being held to is the bytes they send.
wiremock = { workspace = true }
