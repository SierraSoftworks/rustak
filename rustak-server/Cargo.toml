[package]
name = "rustak-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "rustak: a single-binary, embedded-SQLite TAK server."

[lib]
name = "rustak_server"
path = "src/lib.rs"

[[bin]]
name = "rustak"
path = "src/main.rs"

[lints]
workspace = true

[features]
# Exposes test-only mocks (AppContext::new_mock, TestIdentityProvider, …) to
# the in-process integration tests under `tests/`.
# `tempfile` and `wiremock` are dev-dependencies too, so the same modules
# compile under `cargo test` without the feature being asked for.
# `rustak-core/testing` comes with it so that `password::use_testing_params`
# exists for `TestServer` to call; see that function for why the cheaper
# argon2 cost cannot reach a deployment.
testing = [
    "dep:tempfile",
    "dep:wiremock",
    "dep:p256",
    "dep:ed25519-dalek",
    "dep:ciborium",
    "rustak-core/testing",
]

[dependencies]
rustak-api = { workspace = true }
rustak-core = { workspace = true }
rustak-cot = { workspace = true }
actix-web = { workspace = true }
actix-tls = { workspace = true }
actix-ws = { workspace = true }
actix-multipart = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
futures-concurrency = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pki-types = { workspace = true }
rcgen = { workspace = true }
rsa = { workspace = true }
x509-parser = { workspace = true }
instant-acme = { workspace = true }
p12-keystore = { workspace = true }
pem = { workspace = true }
rusqlite = { workspace = true }
tokio-rusqlite = { workspace = true }
include_dir = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
quick-xml = { workspace = true }
zip = { workspace = true }
jsonwebtoken = { workspace = true }
argon2 = { workspace = true }
aes-gcm = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }
filt-rs = { workspace = true }
webauthn_rp = { workspace = true }
bitvec = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
tracing-batteries = { workspace = true }
human-errors = { workspace = true }
opentelemetry = { workspace = true }
clap = { workspace = true }
dotenvy = { workspace = true }
inventory = { workspace = true }
url = { workspace = true }
tempfile = { workspace = true, optional = true }
wiremock = { workspace = true, optional = true }
p256 = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
ciborium = { workspace = true, optional = true }

[dev-dependencies]
# Cargo does not apply `cfg(test)` to the library when it builds `tests/*.rs`, so the
# integration suites reach `pki::testing`, `stream::testing` and friends by switching
# the crate's own `testing` feature on for every test build.
rustak-server = { path = ".", features = ["testing"] }
# `testing` brings in `stream::testing::Eud`, the fake EUD the `stream_*`
# integration suites drive the listener with.
rustak-client = { workspace = true, features = ["testing"] }
rstest = { workspace = true }
# The squashed-change fold is held against a naive replay model over generated
# histories; nothing else in this crate needs generated input.
proptest = { workspace = true }
wiremock = { workspace = true }
tempfile = { workspace = true }
pretty_assertions = { workspace = true }
p256 = { workspace = true }
ed25519-dalek = { workspace = true }
ciborium = { workspace = true }
