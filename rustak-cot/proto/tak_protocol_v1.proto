// TAK Protocol v1 — the binary framing Cursor-on-Target clients negotiate on
// a streaming connection.
//
// This is a clean-room definition. The message names, field names, field
// numbers and wire types below describe an existing, publicly observable
// binary encoding: they are facts about a format rustak has to interoperate
// with, not original expression. No text, comment or fixture was copied from
// any implementation of it.
//
// Two rules keep the schema honest:
//
//   * field numbers are load-bearing and must never be renumbered; and
//   * proto3 ignores fields it does not know, so a peer that sends more than
//     this file declares still decodes, and one that sends less still round
//     trips through the defaults.
syntax = "proto3";

package atakmap.commoncommo.protobuf.v1;

// The envelope carried by every framed message. Both halves are optional:
// a lone `takControl` negotiates capabilities without carrying an event, and
// a lone `cotEvent` is the steady state once a connection has settled.
//
// Numbers 3 and 4 are reserved: some servers add their own ingest and
// creation timestamps there. They are informational, no client requires
// them, and rustak neither emits nor reads them — but nothing else may claim
// those numbers.
message TakMessage {
  TakControl takControl = 1;
  CotEvent cotEvent = 2;
  reserved 3, 4;
}

// Capability chatter: which protocol versions a peer understands, which
// detail extensions it registered, and the contact id its stream belongs to.
//
// rustak negotiates in XML instead (`t-x-takp-v` / `-q` / `-r`), so this
// message is decoded for completeness and never populated on the wire.
message TakControl {
  uint32 minProtoVersion = 1;
  uint32 maxProtoVersion = 2;
  string contactUid = 3;
  repeated uint32 extensionIds = 4;
}

// The binary form of a CoT `<event>` element.
//
// Times are milliseconds since the Unix epoch. `hae`, `ce` and `le` use the
// 999999 sentinel for "unknown", exactly as the XML attributes do. `caveat`
// and `releasableTo` were added after the original schema shipped, which is
// why they sit above `detail` rather than beside the other markings.
message CotEvent {
  string type = 1;
  string access = 2;
  string qos = 3;
  string opex = 4;
  string uid = 5;
  uint64 sendTime = 6;
  uint64 startTime = 7;
  uint64 staleTime = 8;
  string how = 9;
  double lat = 10;
  double lon = 11;
  double hae = 12;
  double ce = 13;
  double le = 14;
  Detail detail = 15;
  string caveat = 16;
  string releasableTo = 17;
}

// The `<detail>` subtree, split into the six sub-messages every client knows
// how to read plus an escape hatch for everything else.
//
// `xmlDetail` holds the children that were not promoted, serialised as raw
// XML with no wrapping element and no declaration. A decoder parses it back
// and merges it with the typed elements; on a name collision the `xmlDetail`
// copy is the one that survives, because it is the only one that can carry
// attributes and children the typed form has no room for.
message Detail {
  string xmlDetail = 1;
  Contact contact = 2;
  Group group = 3;
  PrecisionLocation precisionLocation = 4;
  Status status = 5;
  Takv takv = 6;
  Track track = 7;

  // A detail element owned by a registered extension, carried as its own
  // serialised bytes. rustak registers no extensions, so it relays these
  // untouched rather than interpreting them.
  message ExtensionEncodedDetail {
    uint32 extensionId = 1;
    bytes data = 2;
  }

  repeated ExtensionEncodedDetail extensionDetails = 8;
}

// `<contact callsign= endpoint=/>` — display name and reply address.
message Contact {
  string endpoint = 1;
  string callsign = 2;
}

// `<__group name= role=/>` — the team colour and role a device reports.
message Group {
  string name = 1;
  string role = 2;
}

// `<precisionlocation geopointsrc= altsrc=/>` — where the fix came from.
message PrecisionLocation {
  string geopointsrc = 1;
  string altsrc = 2;
}

// `<status battery=/>` — remaining charge as a whole percentage.
message Status {
  uint32 battery = 1;
}

// `<takv device= platform= os= version=/>` — the reporting device's identity.
message Takv {
  string device = 1;
  string platform = 2;
  string os = 3;
  string version = 4;
}

// `<track speed= course=/>` — ground speed in metres per second and course
// over ground in degrees true.
message Track {
  double speed = 1;
  double course = 2;
}
