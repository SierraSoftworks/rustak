name: Nightly Interop
on:
  schedule:
    # 04:17 UTC daily — after the rest of the world's business-hours CI load,
    # and deliberately *not* on the hour. GitHub queues every repository's
    # top-of-the-hour crons together and drops or delays them under that load:
    # measured here on 2026-09-19, the `0 0 * * *` security audit ran **1h57m**
    # late and this job ran **4h19m** late, arriving in the middle of the next
    # working day instead of before it. A minute nobody else picks costs
    # nothing and is GitHub's own documented advice.
    #
    # Changing a cron means changing the `if:` that selects on it — there are
    # three in this file, and a mismatch silently stops a job selecting itself
    # rather than failing loudly.
    - cron: "17 4 * * *"
    # 03:17 UTC Mondays — rebuilds the commoncommo interop image. A separate
    # cron (rather than a day-of-week test) so `interop-eud-image` can select
    # itself on github.event.schedule.
    - cron: "17 3 * * 1"
  workflow_dispatch: {}
  # The `run-cloudtak` label runs the CloudTAK suite on a pull request. Nothing
  # else in this workflow selects `pull_request`, so every other job here skips
  # on one; `synchronize` is included so a labelled PR re-runs it on a push
  # rather than only when the label is first applied.
  pull_request:
    types: [opened, synchronize, reopened, labeled]

env:
  REGISTRY: ghcr.io
  ORG: sierrasoftworks
  EUD_IMAGE: rustak-interop-commoncommo
  # Kept in step with rust.yml's `ui` job; bump both together and deliberately.
  TRUNK_VERSION: "0.21.14"
  TRUNK_SHA256: "f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b"

jobs:
  # Drives CloudTAK's own container — Postgres, the published CloudTAK API/UI
  # image and a rustak built from this checkout, on one compose network —
  # through CloudTAK's REST API (server configuration, login, channels, Data
  # Sync, packages) plus a Playwright smoke of its UI. See
  # interop/cloudtak/README.md and
  # .claude/plan/status/M4-03-interop-cloudtak-compose.md.
  #
  # Nightly, on demand, and on a pull request labelled `run-cloudtak`: it costs
  # a release build of the server plus a few minutes of containers, which is too
  # much for every PR and worth having on the ones that touch the Marti surface.
  interop-cloudtak:
    name: "Interop: CloudTAK compose"
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.schedule == '17 4 * * *'
      || (github.event_name == 'pull_request'
          && contains(github.event.pull_request.labels.*.name, 'run-cloudtak'))
    # The release build is the long pole on a cold cache; the stack itself is
    # minutes. A job that hits this bound is a bug report.
    timeout-minutes: 60

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: wasm32-unknown-unknown

      - name: Setup Cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            . -> target
            rustak-ui -> target

      # Trunk from its pinned release asset, checksum-verified, with the cache
      # in front — the same shape as rust.yml's `ui` job, and for the same
      # reason: `cargo binstall`'s fetcher chain fails with no fallback when the
      # network is unreliable, and it took out a release doing exactly that.
      - name: Cache Trunk
        id: trunk-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/trunk
          key: trunk-${{ env.TRUNK_VERSION }}-${{ runner.os }}

      - name: Install Trunk
        if: steps.trunk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          url="https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz"

          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
               --retry 5 --retry-all-errors --retry-delay 5 \
               --output /tmp/trunk.tar.gz "$url"

          echo "${TRUNK_SHA256}  /tmp/trunk.tar.gz" | sha256sum --check --strict

          mkdir -p "$HOME/.cargo/bin"
          tar -xzf /tmp/trunk.tar.gz -C "$HOME/.cargo/bin" trunk
          chmod +x "$HOME/.cargo/bin/trunk"

      - name: Put Trunk on the path
        shell: bash
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # The UI is embedded into the binary by `include_dir!` at compile time, so
      # it has to exist before cargo build.
      - name: Build release UI
        working-directory: rustak-ui
        run: trunk build --release

      - name: cargo build
        run: cargo build --release -p rustak-server

      # rustak-server/Dockerfile packages a binary rather than compiling one,
      # and it reads it from dist/ — the same layout the release pipeline's
      # docker-build job stages from its artefact.
      - name: Build the rustak image
        run: |
          mkdir -p dist
          cp target/release/rustak dist/rustak
          chmod +x dist/rustak
          docker build -f rustak-server/Dockerfile -t rustak-interop-cloudtak:local .

      # Node 24 to match the other two suites, whose launcher, bootstrap and
      # surface probe this one shares through interop/shared.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: interop/cloudtak/package-lock.json

      - name: Install dependencies
        working-directory: interop/cloudtak
        run: npm ci

      - name: Typecheck the suite
        working-directory: interop/cloudtak
        run: npm run typecheck

      # Only the UI smoke needs a browser, and it skips rather than fails
      # without one — but a nightly that quietly stopped looking at the UI is
      # exactly the kind of silence this job exists to break.
      - name: Install Chromium for the UI smoke
        working-directory: interop/cloudtak
        run: npx playwright install --with-deps chromium

      # RUSTAK_INTEROP_REQUIRE_DOCKER=1 is the default, and is set here so that
      # a runner that lost its container runtime fails rather than reporting a
      # green run in which every step skipped.
      - name: Run the CloudTAK suite
        working-directory: interop/cloudtak
        env:
          RUSTAK_INTEROP_REQUIRE_DOCKER: "1"
        run: |
          set -o pipefail
          npm test 2>&1 | tee rustak-cloudtak.log

      - name: Upload the run artefacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cloudtak-artefacts
          path: |
            interop/cloudtak/rustak-cloudtak.log
            interop/cloudtak/artifacts/**
          if-no-files-found: warn
          retention-days: 14

  # Builds the EUD harness image: ATAK's own networking core (commoncommo) and
  # its stock `commotest` console client, compiled from a pinned atak-civ
  # commit. Nothing GPL is vendored — interop/eud/Dockerfile clones upstream at
  # build time. See interop/eud/README.md and
  # .claude/plan/status/M1-00-eud-interop-harness-exploration.md.
  #
  # Weekly plus on demand, not nightly: a cold build is ~25-45 min and the
  # result only changes when the pin or the recipe does. The scenario job below
  # consumes the published tag; it never rebuilds the image.
  interop-eud-image:
    name: "Interop: EUD image (commoncommo)"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3 * * 1'
    timeout-minutes: 150

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # interop/eud/Dockerfile's `ARG ATAK_CIV_SHA=` line is the single source
      # of truth for the pin; the image tags are derived from it so a bump can
      # never leave the tag pointing at the wrong upstream revision.
      - name: Resolve the atak-civ pin
        id: pin
        run: |
          sha="$(sed -n 's/^ARG ATAK_CIV_SHA=\([0-9a-f]\{40\}\)[[:space:]]*$/\1/p' interop/eud/Dockerfile | head -n 1)"
          if [ -z "$sha" ]; then
            echo "interop/eud/Dockerfile has no 'ARG ATAK_CIV_SHA=<40 hex chars>' line" >&2
            exit 1
          fi
          image="${REGISTRY}/${ORG}/${EUD_IMAGE}"
          {
            echo "sha=${sha}"
            echo "short=${sha:0:7}"
            echo "image=${image}"
          } >> "$GITHUB_OUTPUT"
          echo "Building ${image} from atak-civ ${sha}"

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # linux/amd64 only: takthirdparty's TARGET is linux-amd64 and the runner
      # is amd64, so there is no emulation cost to pay and no arm64 consumer.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: interop/eud
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            ATAK_CIV_SHA=${{ steps.pin.outputs.sha }}
          tags: |
            ${{ steps.pin.outputs.image }}:atak-civ-${{ steps.pin.outputs.sha }}
            ${{ steps.pin.outputs.image }}:atak-civ-${{ steps.pin.outputs.short }}
            ${{ steps.pin.outputs.image }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=${{ steps.pin.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.pin.outputs.image }}:buildcache,mode=max

      # commotest has no exit-code contract — every path returns 0 — so assert
      # on the help listing, which is also the only invocation with a bounded
      # runtime and no network.
      - name: Smoke-test the published image
        run: |
          image="${{ steps.pin.outputs.image }}:atak-civ-${{ steps.pin.outputs.short }}"
          docker run --rm "$image" -h > help.txt 2>&1 || true
          for marker in 'estream:' 'sstream:' 'chatsend:' 'smpsend:' 'proto:'; do
            grep -qF "$marker" help.txt || {
              echo "commotest -h did not list '${marker}'" >&2
              cat help.txt >&2
              exit 1
            }
          done
          echo "commotest CLI surface intact"

  # The scenario suite: drives the image above against a live rustak —
  # enrollment (`estream:`), TLS, TAK Protocol v1 negotiation, ping/pong, SA and
  # chat routing, disconnect and mission-package transfer — asserting on
  # commotest's commo-log.txt / commo-xml.txt and on rustak's own API. See
  # interop/eud/README.md → Scenarios and
  # .claude/plan/status/M2-09-eud-interop-scenarios.md.
  #
  # It consumes the published tag and never rebuilds the image, so it does not
  # `needs:` the job above: a night on which the image build did not run is a
  # night this still has an image to pull.
  interop-eud:
    name: "Interop: EUD harness"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 4 * * *'
    # Thirty, not ninety. The envelope is ~15 minutes — nine scenarios took
    # 13m20s on the first full run — and the build and image pull in front of
    # them are a few more. Ninety was a guess made before anything had run, and
    # on 35379867680 it cost 82 idle minutes: the runner died nine minutes in and
    # an orphaned server held the step's stdout open, so the job sat until the
    # bound expired. That orphan is fixed in `interop/shared/src/launch.ts`, but
    # a bound this loose is no longer telling anybody anything. A job that hits
    # thirty is a bug report, which is the point of the number.
    timeout-minutes: 30

    permissions:
      contents: read
      # The GHCR package is private to the organisation on purpose — publishing
      # GPL binaries is conveying under GPLv3 §6, and internal use is not. So
      # the job has to authenticate to pull it.
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: wasm32-unknown-unknown

      - name: Setup Cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            . -> target
            rustak-ui -> target

      # Trunk from its pinned release asset, checksum-verified, with the cache
      # in front — the same shape as rust.yml's `ui` job, and for the same
      # reason: `cargo binstall`'s fetcher chain fails with no fallback when the
      # network is unreliable, and it took out a release doing exactly that.
      - name: Cache Trunk
        id: trunk-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/trunk
          key: trunk-${{ env.TRUNK_VERSION }}-${{ runner.os }}

      - name: Install Trunk
        if: steps.trunk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          url="https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz"

          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
               --retry 5 --retry-all-errors --retry-delay 5 \
               --output /tmp/trunk.tar.gz "$url"

          echo "${TRUNK_SHA256}  /tmp/trunk.tar.gz" | sha256sum --check --strict

          mkdir -p "$HOME/.cargo/bin"
          tar -xzf /tmp/trunk.tar.gz -C "$HOME/.cargo/bin" trunk
          chmod +x "$HOME/.cargo/bin/trunk"

      - name: Put Trunk on the path
        shell: bash
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # The UI is embedded into the binary by `include_dir!` at compile time, so
      # it has to exist before cargo build. Release rather than debug: nothing
      # here drives the admin UI, so the `?demo` fixtures are dead weight.
      - name: Build release UI
        working-directory: rustak-ui
        run: trunk build --release

      - name: cargo build
        run: cargo build -p rustak-server

      # The `ARG ATAK_CIV_SHA=` line in interop/eud/Dockerfile is the single
      # source of truth for the pin, exactly as in interop-eud-image above, so
      # the scenarios run against the revision this tree pins. `:latest` is the
      # fallback for the window after a pin bump and before the weekly build has
      # published the new tag.
      - name: Resolve the image tag
        id: image
        run: |
          sha="$(sed -n 's/^ARG ATAK_CIV_SHA=\([0-9a-f]\{40\}\)[[:space:]]*$/\1/p' interop/eud/Dockerfile | head -n 1)"
          if [ -z "$sha" ]; then
            echo "interop/eud/Dockerfile has no 'ARG ATAK_CIV_SHA=<40 hex chars>' line" >&2
            exit 1
          fi
          echo "image=${REGISTRY}/${ORG}/${EUD_IMAGE}:atak-civ-${sha:0:7}" >> "$GITHUB_OUTPUT"
          echo "fallback=${REGISTRY}/${ORG}/${EUD_IMAGE}:latest" >> "$GITHUB_OUTPUT"

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the EUD image
        id: pull
        run: |
          if docker pull "${{ steps.image.outputs.image }}"; then
            echo "RUSTAK_EUD_IMAGE=${{ steps.image.outputs.image }}" >> "$GITHUB_ENV"
          elif docker pull "${{ steps.image.outputs.fallback }}"; then
            echo "The pinned tag is not published yet; falling back to :latest." >&2
            echo "RUSTAK_EUD_IMAGE=${{ steps.image.outputs.fallback }}" >> "$GITHUB_ENV"
          else
            echo "Neither the pinned tag nor :latest could be pulled. Run the" >&2
            echo "interop-eud-image job (workflow_dispatch) to publish one." >&2
            exit 1
          fi

      # Node 24 to match interop/node-tak, whose launcher and bootstrap this
      # suite shares through interop/shared.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: interop/eud/package-lock.json

      - name: Install dependencies
        working-directory: interop/eud
        run: npm ci

      - name: Typecheck the suite
        working-directory: interop/eud
        run: npm run typecheck

      # RUSTAK_EUD_REQUIRE_DOCKER=1 is what makes a runner without a container
      # runtime fail here rather than reporting a green run in which every
      # scenario skipped. The log is kept whatever happens, because the rustak
      # side of a failure is in it.
      - name: Run the EUD scenarios
        working-directory: interop/eud
        env:
          RUSTAK_EUD_REQUIRE_DOCKER: "1"
        run: |
          set -o pipefail
          npm test 2>&1 | tee rustak-eud.log

      - name: Upload the scenario artefacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: eud-artefacts
          path: |
            interop/eud/rustak-eud.log
            interop/eud/artifacts/**
          if-no-files-found: warn
          retention-days: 14
