name: Rust
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  release:
    types: [published]

env:
  VERSION: "0.0.0-dev"
  REGISTRY: ghcr.io
  ORG: sierrasoftworks

concurrency:
  group: rust-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deduplicate:
    name: Check CI Result
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    outputs:
      cache-hit: ${{ steps.success.outputs.cache-hit }}
      fingerprint: ${{ steps.fingerprint.outputs.tree }}

    steps:
      - name: Check out merge result
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7

      - name: Fingerprint merge result
        id: fingerprint
        if: github.event_name == 'pull_request'
        run: echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      - name: Find successful result
        id: success
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: .ci-success
          key: rust-ci-v1-${{ steps.fingerprint.outputs.tree }}
          lookup-only: true

  version:
    name: Start Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: deduplicate
    if: github.event_name != 'pull_request' || needs.deduplicate.outputs.cache-hit != 'true'

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Generate Package Version (Release Tag)
        shell: pwsh
        if: github.event_name == 'release'
        run: Add-Content -Path $env:GITHUB_ENV -Value "VERSION=$('${{ github.event.release.tag_name }}'.substring(1))"

      # rustak is a multi-crate workspace: every crate inherits its version from
      # the single `[workspace.package]` table in the root Cargo.toml, so (unlike
      # automate, which rewrites one package's manifest) only that one line needs
      # rewriting for every binary in the `build` matrix to pick up the release
      # version.
      - name: Set Workspace Version
        run: sed -i "s/^version\s*=\s*\".*\"/version = \"$VERSION\"/g" Cargo.toml

      - name: Stash Versioned Cargo.toml
        uses: actions/upload-artifact@v7
        with:
          name: cargofile
          path: Cargo.toml

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: deduplicate

    permissions:
      contents: read

    if: github.event_name != 'pull_request' || needs.deduplicate.outputs.cache-hit != 'true'

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Setup Cache
        uses: Swatinem/rust-cache@v2

      # No protoc step here or anywhere else in this workflow: rustak-cot builds
      # its protobuf definitions with protox (a pure-Rust protoc), so the whole
      # pipeline never shells out to a system protoc binary.

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: File length check
        run: scripts/check-file-length.sh

      - name: cargo doc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: deduplicate

    permissions:
      contents: read

    if: github.event_name != 'pull_request' || needs.deduplicate.outputs.cache-hit != 'true'

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Setup Cache
        uses: Swatinem/rust-cache@v2

      - name: cargo install grcov
        uses: SierraSoftworks/setup-grcov@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        run: cargo test --workspace --no-fail-fast
        env:
          RUSTFLAGS: -Cinstrument-coverage
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: grcov
        run: grcov . --binary-path target/debug/deps/ -s . -t lcov --ignore-not-existing --ignore '../**' --ignore '/*' --ignore 'C:/' --ignore 'rustak-ui/*' -o ./lcov.info

      - name: codecov upload
        uses: codecov/codecov-action@v7.1.0
        with:
          files: ./lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  ui:
    name: Build UI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: deduplicate

    permissions:
      contents: read

    if: github.event_name != 'pull_request' || needs.deduplicate.outputs.cache-hit != 'true'

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      # Pinned to the current stable release (0.21.14); 0.22 is still beta at
      # the time this pipeline was written. Bump deliberately, not via
      # dependabot (it has no visibility into cargo-binstall installs).
      - name: Install Trunk
        shell: bash
        run: |
          # Prebuilt only: compiling trunk from source has broken before on
          # transitive cssparser/lightningcss mismatches, so fail fast instead.
          cargo binstall --no-confirm --disable-strategies compile trunk@0.21.14
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Setup Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rustak-ui -> target

      # rustak-ui is excluded from the workspace (it targets wasm32, not the
      # host triple), so the workspace-wide `lint` job never touches it. Lint it
      # here instead, where the wasm32 toolchain is already installed.
      - name: cargo fmt --check (rustak-ui)
        working-directory: rustak-ui
        run: cargo fmt --all --check

      - name: cargo clippy (rustak-ui)
        working-directory: rustak-ui
        run: cargo clippy --all-targets --target wasm32-unknown-unknown -- -D warnings

      # e2e specs rely on `?demo` fixtures for deterministic integration data.
      # Demo mode is compiled out of release bundles, so a debug bundle is kept
      # for that job before the release bundle is produced below.
      - name: Build UI for E2E
        working-directory: rustak-ui
        run: trunk build

      - name: Upload E2E UI artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ui-dist-e2e
          path: rustak-ui/dist

      - name: Build release UI
        working-directory: rustak-ui
        run: trunk build --release

      - name: Upload release UI artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: rustak-ui/dist

  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - deduplicate
      - ui

    if: github.event_name != 'pull_request' || needs.deduplicate.outputs.cache-hit != 'true'

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Setup Cache
        uses: Swatinem/rust-cache@v2

      # The UI is embedded into rustak-server by `include_dir!` at compile
      # time. e2e uses the debug bundle because several (future) specs rely on
      # deterministic `?demo` fixtures, deliberately absent from release builds.
      - name: Fetch E2E UI bundle
        uses: actions/download-artifact@v8
        with:
          name: ui-dist-e2e
          path: rustak-ui/dist

      - name: cargo build
        run: cargo build -p rustak-server

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  # The CloudTAK-library contract suite: drives rustak with the very libraries
  # CloudTAK depends on (`@tak-ps/node-tak`, `@tak-ps/node-cot`). See
  # interop/node-tak/README.md.
  #
  # A real gate since M2-03 landed `/oauth/token` and `/Marti/api/tls/*`: the
  # login and enrollment scenarios now run rather than skip, and with them the
  # mutually authenticated `GET /Marti/api/version` that proves an issued
  # certificate completes a handshake against our own listener. Scenarios whose
  # endpoints are still to come (M3, M4) report as skips naming the brief that
  # will serve them, and start running on their own when it lands. M2-06 landed
  # the channel and contact surfaces, so those scenarios are gates now too.
  interop-node-tak:
    name: "Interop: node-tak"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    needs:
      - deduplicate
      - ui

    if: github.event_name != 'pull_request' || needs.deduplicate.outputs.cache-hit != 'true'

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Setup Cache
        uses: Swatinem/rust-cache@v2

      # The release bundle, unlike e2e's: nothing here drives the admin UI, so
      # the `?demo` fixtures a debug bundle carries are dead weight. The UI is
      # still embedded into the server by `include_dir!` at compile time, so it
      # has to be in place before `cargo build`.
      - name: Fetch release UI bundle
        uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: rustak-ui/dist

      - name: cargo build
        run: cargo build -p rustak-server

      # Node 24 rather than e2e's 22: CloudTAK's own API declares
      # `"node": ">= 24"`, and the point of this suite is to run its libraries
      # the way it runs them.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: interop/node-tak/package-lock.json

      - name: Install dependencies
        working-directory: interop/node-tak
        run: npm ci

      - name: Typecheck the suite
        working-directory: interop/node-tak
        run: npm run typecheck

      # Starts its own throwaway server in a scratch directory, bootstraps it
      # through /api/v1 and removes everything on the way out.
      - name: Run the node-tak contract suite
        working-directory: interop/node-tak
        run: npm test

  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.crate.bin }}
    runs-on: ${{ matrix.run_on }}
    timeout-minutes: 45

    needs:
      - deduplicate
      - version
      - ui

    if: github.event_name != 'pull_request' || needs.deduplicate.outputs.cache-hit != 'true'

    strategy:
      fail-fast: false
      matrix:
        crate:
          - { name: rustak-server, bin: rustak }
          - { name: rustak-plugin-example, bin: rustak-plugin-example }
        # `target` is a real matrix axis so the `include` entries below merge
        # onto it by key (an include list without a shared key would collapse
        # every target into one job per crate).
        target:
          - x86_64-pc-windows-msvc
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-apple-darwin
          - aarch64-apple-darwin
        include:
          # Windows
          - target: x86_64-pc-windows-msvc
            arch: amd64
            os: windows
            run_on: windows-latest
            extension: .exe
            builder: cargo

          # Linux
          - target: x86_64-unknown-linux-musl
            arch: amd64
            os: linux
            run_on: ubuntu-24.04
            builder: cargo
            setup: |
              sudo apt update && sudo apt install -y musl-tools
          - target: aarch64-unknown-linux-musl
            arch: arm64
            os: linux
            run_on: ubuntu-latest
            builder: cross

          # Apple
          - target: x86_64-apple-darwin
            arch: amd64
            os: darwin
            run_on: macos-latest
            builder: cargo
          - target: aarch64-apple-darwin
            arch: arm64
            os: darwin
            run_on: macos-latest
            builder: cargo

    steps:
      - name: Run setup script
        if: matrix.setup
        run: ${{ matrix.setup }}

      - name: Check out code
        uses: actions/checkout@v7

      - name: Get Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          components: llvm-tools-preview

      # No protoc / setup-protoc step for either builder: protox (a pure-Rust
      # protoc) is a build-dependency of rustak-cot, so cross's Docker images
      # need nothing extra to compile it either.

      - name: Install Cross
        if: matrix.builder == 'cross'
        shell: bash
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall --no-confirm --disable-strategies compile cross

      - name: Setup Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Fetch Versioned Cargo.toml
        uses: actions/download-artifact@v8
        with:
          name: cargofile
          path: .

      - name: Fetch UI bundle
        uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: rustak-ui/dist

      - name: cargo build
        run: ${{ matrix.builder }} build --release --target ${{ matrix.target }} -p ${{ matrix.crate.name }}

      # cross runs the compiler inside a Docker container as root; see
      # automate's rust.yml for the full explanation of why the cache save
      # would otherwise fail.
      - name: Reclaim cache ownership from cross
        if: matrix.builder == 'cross'
        run: sudo chown -R "$(id -u):$(id -g)" "$HOME/.cargo" target

      - name: Upload GitHub Release Artifacts
        uses: SierraSoftworks/gh-releases@v1.0.10
        if: github.event_name == 'release'
        with:
          files: "target/${{ matrix.target }}/release/${{ matrix.crate.bin }}${{ matrix.extension }} | ${{ matrix.crate.bin }}-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.extension }}"
          token: ${{ secrets.GITHUB_TOKEN }}
          overwrite: "true"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.crate.bin }}-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.extension }}
          path: target/${{ matrix.target }}/release/${{ matrix.crate.bin }}${{ matrix.extension }}

  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    needs:
      - deduplicate
      - version
      - lint
      - test
      - ui
      - e2e
      - interop-node-tak
      - build
      # `tap` only runs on a release, and until v0.0.1 it was not a dependency
      # of this job at all — so that release published ten assets and four image
      # tags, failed to write the Homebrew formula, and still reported a green
      # `CI`. A release that did not publish the formula is not a successful
      # release. Nothing depends on `ci`, so waiting for `tap` delays only this
      # aggregator and never the images.
      - tap

    if: always()

    permissions:
      contents: read

    steps:
      - name: Verify CI result
        env:
          CACHE_HIT: ${{ needs.deduplicate.outputs.cache-hit }}
          DEDUPLICATE_RESULT: ${{ needs.deduplicate.result }}
          VERSION_RESULT: ${{ needs.version.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          UI_RESULT: ${{ needs.ui.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          INTEROP_NODE_TAK_RESULT: ${{ needs.interop-node-tak.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          TAP_RESULT: ${{ needs.tap.result }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            echo "This merge tree has already passed CI."
            exit 0
          fi

          failed=0
          for job in \
            "Check CI Result=$DEDUPLICATE_RESULT" \
            "Start Release=$VERSION_RESULT" \
            "Lint=$LINT_RESULT" \
            "Test=$TEST_RESULT" \
            "Build UI=$UI_RESULT" \
            "End-to-End Tests=$E2E_RESULT" \
            "Interop: node-tak=$INTEROP_NODE_TAK_RESULT" \
            "Build=$BUILD_RESULT"
          do
            name="${job%%=*}"
            result="${job#*=}"
            if [ "$result" != "success" ]; then
              echo "::error::$name completed with result '$result'."
              failed=1
            fi
          done

          # `tap` is the one dependency that is *meant* to be skipped most of
          # the time: it selects `github.event_name == 'release'`, so every
          # push and pull request leaves it skipped and that is not a failure.
          # On a release it has to have succeeded.
          case "$TAP_RESULT" in
            success | skipped) ;;
            *)
              echo "::error::Update Homebrew Tap completed with result '$TAP_RESULT'."
              failed=1
              ;;
          esac

          exit "$failed"

      - name: Create success marker
        if: github.event_name == 'pull_request' && needs.deduplicate.outputs.cache-hit != 'true'
        run: |
          mkdir -p .ci-success
          echo "${{ needs.deduplicate.outputs.fingerprint }}" > .ci-success/merge-tree

      - name: Save successful result
        if: github.event_name == 'pull_request' && needs.deduplicate.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: .ci-success
          key: rust-ci-v1-${{ needs.deduplicate.outputs.fingerprint }}

  docker-build:
    name: "Docker Build: ${{ matrix.crate.bin }} (${{ matrix.platform }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - build

    # Unlike automate (release-only), rustak's M0 exit criterion requires
    # `ghcr.io/sierrasoftworks/rustak:latest` to exist on a green `main`, so
    # this also runs on pushes to main.
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        crate:
          - { name: rustak-server, bin: rustak }
          - { name: rustak-plugin-example, bin: rustak-plugin-example }
        platform: [linux/amd64, linux/arm64]

    steps:
      - name: set environment variables
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

          arch=${platform##*/}
          echo "ARCH=${arch}" >> $GITHUB_ENV

          image="${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.crate.bin }}"
          image="$(echo $image | tr '[:upper:]' '[:lower:]')"
          echo "FULL_IMAGE_NAME=${image}" >> $GITHUB_ENV

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.FULL_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Checkout code
        uses: actions/checkout@v7

      # Download into dist/ rather than the checkout root: the binary shares its
      # name with the crate directory (e.g. rustak-plugin-example/), and
      # extracting a file over an existing directory fails.
      - name: Pull in platform artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.crate.bin }}-linux-${{ env.ARCH }}
          path: dist

      - name: mark artifact as executable
        run: chmod +x dist/${{ matrix.crate.bin }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.crate.name }}/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.FULL_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests/${{ matrix.crate.bin }}
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${{ matrix.crate.bin }}/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: image-digest-${{ matrix.crate.bin }}-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/${{ matrix.crate.bin }}/*
          if-no-files-found: error
          retention-days: 1

  docker-publish:
    name: "Docker Publish: ${{ matrix.crate.bin }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - docker-build

    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      matrix:
        crate:
          - { name: rustak-server, bin: rustak }
          - { name: rustak-plugin-example, bin: rustak-plugin-example }

    steps:
      - name: set environment variables
        run: |
          image="${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.crate.bin }}"
          image="$(echo $image | tr '[:upper:]' '[:lower:]')"
          echo "FULL_IMAGE_NAME=${image}" >> $GITHUB_ENV

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          # Anchor on the platform prefix: `image-digest-rustak-*` would also
          # match `image-digest-rustak-plugin-example-*` and mix the digests.
          pattern: image-digest-${{ matrix.crate.bin }}-linux-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.FULL_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.FULL_IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ env.FULL_IMAGE_NAME }}:${{ steps.meta.outputs.version }}

  tap:
    name: Update Homebrew Tap
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'release'
    needs:
      - build
    steps:
      # Formula name is inferred by the action from the repository (rustak),
      # matching design 01 §7.3's "formula `rustak`" — unlike automate, whose
      # repository (automate-rs) and package (automate) names differ, rustak's
      # repository is already named after its binary so no override is needed.
      - name: Update Homebrew Tap
        uses: SierraSoftworks/actions-tap@v1
        with:
          app-id: ${{ secrets.TAP_APP_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          aliases: major minor
          # A Homebrew formula must carry a `desc`, and the action derives one
          # from the source repository's description. This repository has none
          # set, so the token above finds an empty string and the job fails with
          # "No usable description for rustak" — which is what happened on the
          # v0.0.1 release, after every other job in the run had passed. Stating
          # it here fixes it without depending on a repository setting that only
          # an administrator can change, and keeps the formula's description in
          # the same review as the code. It is the README's one-line summary;
