# rustak server configuration.
#
# Every key is shown with its default. A key that is commented out has the
# default written beside it; a key that is shown uncommented is set to its
# default, so this file describes a working installation as it stands.
#
# Any value may be written as "${{ env.NAME }}", which is substituted from the
# environment (or from the file passed to --env) before the file is parsed. That
# is how secrets stay out of a file you commit or attach to a support ticket.
#
# Unknown and misplaced keys are refused rather than ignored, so
# `rustak --config config.toml --check` is a real check of this file.
#
# Durations are written as "45s", "15m", "12h" or "3650d".


[server]
# The name clients see on /Marti/api/version and at the top of the admin UI.
name = "rustak"

# The public host names this server answers to. The FIRST is canonical: it is
# the host embedded in enrollment QR codes and device profiles, the subject of
# the internal server certificate, and the default token issuer. Changing it
# invalidates what already-enrolled devices hold.
# Default: [] — the first-run setup wizard is how most installations set this.
domains = ["tak.example.com"]

# The externally visible base URL. Default: "https://<first domain>". Set it
# when a proxy publishes rustak on a different port than the one it binds.
#
# This is also the WebAuthn relying party: a passkey is bound to the host the
# console is served from and will not work at any other, so this has to be the
# host browsers actually use. It must be a name rather than an address — a
# console reached at https://192.0.2.10 cannot register a passkey at all. In
# development, where `trunk serve` proxies to this server from its own port,
# use a `localhost` host name: the port may differ there, and nowhere else.
# base_url = "https://tak.example.com:8446"

# Whether X-Forwarded-* headers are believed. Only turn this on behind a proxy
# that sets them: without one, any client can claim any source address, and the
# credential rate limiter keys on it.
trust_proxy = false

# Where the database, the secret key file, the content store, the stream
# segments and the ACME cache live.
data_dir = "./data"

# How long connections that are still open are given to close when rustak is
# asked to stop, before they are cut off. At most "60s".
#
# The budget covers the drain only. The WAL checkpoint that follows it — the
# one that decides whether the next start has a log to fold back in — has its
# own two-second cap on top, so a stop takes up to this plus two seconds.
# `docker stop` allows ten in total before it sends SIGKILL, which is where the
# default comes from: raise both together, or neither. A second SIGINT/SIGTERM
# ends the drain early and still runs the checkpoint.
shutdown_timeout = "8s"

# How long an outbound HTTP request may take in total, and how long its connect
# phase may take. These cover every request the server makes: OIDC discovery and
# JWKS, the OIDC token exchange, and ACME. Without them a provider whose load
# balancer accepts the connection and never answers hangs every sign-in behind
# it. "0s" turns a limit off.
http_timeout = "30s"
http_connect_timeout = "10s"


[storage]
# The SQLite database. Default: "<data_dir>/rustak.sqlite". The key that seals
# stored secrets lives beside it, so moving this moves both. A relative path is
# taken against data_dir, not the working directory.
# database = "rustak.sqlite"

# The content-addressed blob store. Default: "<data_dir>/content".
# content_dir = "content"

# The append-only CoT history segments. Default: "<data_dir>/streams". History
# is written here as framed segment files rather than as database rows, so a
# busy installation's write volume never reaches SQLite.
# streams_dir = "streams"

# Read-only WAL connections opened alongside the single writer. 0 makes reads
# share the writer, which serialises them.
reader_connections = 2

# How long a statement waits for the write lock before returning SQLITE_BUSY.
busy_timeout = "5s"

# How often the PASSIVE WAL checkpoint job runs. The WAL is also truncated on a
# clean shutdown; this is what keeps it bounded on a server that stays up.
checkpoint_interval = "5m"

# How many per-device CoT history logs the writer keeps open at once. Each one
# costs a file descriptor, so keep this above [stream.limits] max_connections
# and below the process descriptor limit (`ulimit -n`). Below the number of
# connected devices the writer thrashes: every message evicts somebody else's
# log and pays to reopen it.
open_history_logs = 4096


# The browser- and enrollment-facing listener: the admin UI, /api/v1, /oauth/*,
# /login/*, /Marti/api/tls/* and the full Marti API for CloudTAK's webtak role.
[web.public]
# Addresses to bind, all serving the same routes. Add ":443" for browsers that
# will not be told a port number, and for the ACME tls-alpn-01 challenge;
# binding it needs CAP_NET_BIND_SERVICE or a forwarding proxy.
listen = [":8446"]

# An optional plaintext address. It serves exactly two things: the ACME http-01
# challenge path (/.well-known/acme-challenge/), and a 301 to
# https://<host><path> for everything else — no API, no admin UI, no Marti and
# no cookies. Use ":80" where rustak may bind it, or a higher port with a proxy
# forwarding :80 to it. The redirect points at the first `listen` address above
# (or at `[server] base_url` where that is set), and only ever at a host this
# installation answers to: a request naming any other is sent to
# `[server] domains[0]` rather than back to itself.
#
# This is NOT `allow_insecure_http`: that key permits serving the real surface
# without TLS, which this listener never does. Default: unset.
# plain_bind = ":80"

# Permits `[web.public.tls] mode = "none"`. Serving credentials, tokens and
# certificate enrollment over plaintext HTTP takes this deliberate second
# statement; development and the end-to-end suites set both.
allow_insecure_http = false

[web.public.tls]
# Where this listener's certificate comes from:
#   "internal" — rustak's own CA issues it, and devices are given that CA in
#                their enrollment package. Needs no public DNS and no open port
#                80; browsers will not trust it until the CA is installed.
#   "files"    — cert_file and key_file below, re-read while rustak runs when
#                they change on disk, and waited for when they are not there
#                yet. No restart for a renewal.
#   "acme"     — ordered from an ACME authority; see [acme].
#   "none"     — no TLS, for development or behind a terminating proxy.
#                Refused unless allow_insecure_http is also set.
mode = "internal"

# Required by mode = "files": the full chain, and its private key, in PEM form.
# cert_file = "/etc/rustak/fullchain.pem"
# key_file = "/etc/rustak/privkey.pem"

# How often mode = "files" looks at those two files: a stat of each, and a
# re-read only when the size, modification time or inode of one has moved. A
# new pair is served only if the key belongs to the leaf, so a half-written
# renewal is ignored rather than breaking every handshake. "0" switches the
# check off and leaves POST /api/v1/settings/tls/renew as the way to pick a
# renewal up without a restart.
reload_interval = "30s"

# Whether a missing or unreadable pair stops rustak at start-up. The default
# binds the listener with a certificate from rustak's own CA, warns with both
# paths, and swaps the files in as soon as they appear — which is what a
# sidecar that renders them after the task starts needs. Set it to true when
# the files ship with the image and their absence means something is wrong;
# `rustak --check` then refuses a configuration whose files are not there.
require_files_at_start = false


# The mutually authenticated Marti listener. Every caller presents a client
# certificate rustak issued, which is both its authentication and its device
# identity. It serves the TAK surface only — no admin UI and no /api/v1 — and a
# caller with no certificate is refused at the handshake rather than by a
# handler, so a device enrols against [web.public] first and uses this port
# afterwards. Switching it off leaves everything reachable on [web.public].
[web.marti]
enabled = true
listen = ":8443"

# "required" is the only accepted value. TAK Server allows an optional client
# certificate here and accepts bearer tokens instead; rustak does not, because a
# device that cannot present a certificate has not enrolled, and everything it
# might want is available on [web.public] with a bearer token.
client_cert = "required"


# The TAK-compatible HTTP surface (/Marti/**, /files/api/config, /oauth/*),
# served on both listeners above. Certificate enrolment (/Marti/api/tls/*) and
# the OAuth2 password grant (/oauth/token) accept HTTP Basic — a username with a
# one-time enrolment token or a client password — and nothing else on either
# listener does; see [auth] enrollment_token_ttl and client_passwords_enabled.
# These keys decide what outside clients are told, so changing one changes what
# already-enrolled devices do.
[marti]
# The host name written into URLs handed back to clients — a package download
# link an EUD passes on to its peers, so it has to be a name they can resolve.
# Default: the Host header of the request being answered, which is right for a
# directly reachable server and wrong for one behind NAT or inside a container.
# public_host = "tak.example.com"

# The upload ceiling reported by GET /files/api/config, in megabytes. CloudTAK's
# setup wizard will not save a server connection until that endpoint answers
# with an integer here, so it is the first thing a CloudTAK bring-up exercises.
upload_size_limit_mb = 400

# Whether Access-Control-Allow-*: * is added to Marti responses. Off by default:
# ATAK and CloudTAK's server are not browsers and never send an Origin, and the
# admin UI is same-origin. Turning it on makes every Marti response readable by
# any page the operator's users happen to visit.
allow_all_origins = false

# Whether crash reports posted to /Marti/ErrorLog are kept. They are stored with
# the body truncated and the count capped. Turning this off discards them and
# still answers 200, because a client that cannot file a crash report retries.
store_error_logs = true
error_log_retention = 200


# The CoT stream.
[stream]
# How the server answers a client's TAK Protocol v1 request. A
# COMPATIBILITY-TESTING SWITCH, not an operational one — leave it at "accept"
# unless you are deliberately reproducing a broken server:
#
#   "accept" — offer protobuf and accept a request for version 1. (default)
#   "refuse" — offer, then answer the request with status="false". ATAK falls
#              back to XML for the life of the connection and logs
#              "protocol negotiation request denied, using xml only".
#   "silent" — never send the offer at all. ATAK waits sixty seconds, logs
#              "Timed out waiting for protocol version support message" and
#              carries on in XML without reconnecting.
#
# The two negative values exist so the EUD interop suite (interop/eud, scenarios
# negotiate-refused and negotiate-silent) can drive ATAK's own fallback paths
# against a server that is otherwise working. Setting either here costs every
# client protobuf framing and gains nothing. To switch protobuf off altogether
# — the supported way — use [stream.limits] negotiate_protobuf = false instead.
# negotiation = "accept"


# The CoT streaming listener. A client certificate is always required: there is
# no plaintext [stream.tcp] section and no anonymous access, by design.
[stream.tls]
enabled = true
listen = ":8089"

# How long a connection may go without traffic before it is closed. TAK clients
# ping well inside this; the timeout reclaims connections whose device fell off
# the network without closing its socket.
idle_timeout = "90s"


# What one stream connection may cost the server.
[stream.limits]
# The largest inbound message, in bytes, in either encoding. A message past this
# is consumed and dropped; the connection carries on.
max_frame = 8388608

# How many messages may be waiting to be written to one connection before
# deliveries start being dropped.
#
# It is also the floor under a new client's map. A client that has just
# connected is sent one cached position per peer it may see, before it has read
# a byte, so on a fleet larger than this the replay has to wait for its own
# writer part-way through. It does wait — the map is never silently truncated —
# but the wait is paid by every device after a restart, so keep this at or above
# max_connections on an installation that expects a full house. Below it, rustak
# warns at start-up naming both numbers.
queue_len = 1024

# How many deliveries in a row may be dropped before the connection is closed.
# Closing is what makes a permanently-behind client resynchronise: it reconnects
# and is replayed the latest position of everyone it can see. The connect-time
# replay is exempt: a client is never closed over its own map.
close_after_drops = 512

# How long the TLS handshake has to complete before the socket is closed.
handshake_timeout = "10s"

# How long one write to a connected client may take before the connection is
# given up on, and the budget a new client's map replay is sent within.
#
# This is the bound on a device that completes the handshake and then stops
# reading — a phone that sleeps, a NAT that silently blackholes. Without it the
# writer parks on a socket whose window is zero and holds the file descriptor,
# the TLS session and the task for the life of the process, while the connection
# count still reads healthy. A device on a poor link takes seconds to accept a
# burst; one that has taken none of a single flush in half a minute is gone.
write_timeout = "30s"

# The most connections this listener accepts at once. Further connections wait
# for a slot rather than being refused. See queue_len above.
max_connections = 1024

# Whether to offer TAK Protocol v1 (protobuf) to clients as they connect. Turn
# it off for a fleet whose clients mishandle the offer; XML always works.
negotiate_protobuf = true

# Whether relayed messages are recorded to `cot_latest` and to the append-only
# history segments. Turning this off leaves /Marti/api/cot/xml/{uid} with
# nothing to answer.
record_history = true


[auth]
# The `iss` claim of the tokens we issue. Default: the server's base URL.
# issuer = "https://tak.example.com"

# The `aud` claim we issue and require.
audience = "rustak"

# How long an access token lasts, and how long a refresh token lasts. Refresh
# tokens rotate; reuse of a consumed one revokes the whole family.
access_token_ttl = "1h"
refresh_token_ttl = "30d"

# Who may sign in, and who is an administrator. filt-rs expressions over
# method/path/client_ip/headers.*/claims.*/username/source. BOTH DEFAULT TO
# DENYING EVERYBODY: an installation that configures an identity provider and
# forgets these admits nobody, rather than admitting the provider's whole
# directory. The first admin registered by the setup wizard is authorised by the
# users.is_admin column instead, so a fresh installation is administrable
# without writing a filter.
#
# `user_acl` gates accounts the identity provider vouches for: at sign-in, and
# on every later request, judged against the claims that sign-in recorded. It
# does not apply to accounts made here (passkeys) or to services — they were
# admitted when they were created, and the passkey exists precisely so that an
# administrator keeps a way in when the directory is wrong or away.
#
# `admin_acl` is evaluated the same way, and is ORed with the administrator
# flag on the account, so an administrator made here stays one.
# user_acl = 'true'
# admin_acl = 'claims.groups contains "tak-admins"'

# Whether a new user joins __ANON__, the default channel TAK clients expect.
anon_group_default = true

# How long a one-time enrollment token may be used. It is scanned from a QR code
# or typed into a device within a minute or two of being minted, and it is
# consumed by the certificate it authorises.
enrollment_token_ttl = "15m"

# How long a SPENT enrollment token may still fetch the enrollment device
# profile. ATAK enrols in three calls with one token — GET /Marti/api/tls/config,
# POST /Marti/api/tls/signClient/v2 (which spends it), then
# GET /Marti/api/tls/profile/enrollment?clientUid=, unconditionally and with the
# same credential. Inside this window the third call is answered, and only that:
# only the two /Marti/api/tls/profile routes, only for the clientUid the token
# was spent by, never a second signClient and never /oauth/token. "0s" refuses
# it outright, at the cost of ATAK reporting "Failed to get profile (401)".
enrollment_grace = "10m"

# Long-lived client passwords are a COMPATIBILITY credential: CloudTAK
# authenticates with a username and password against /oauth/token and has no
# other option today. They are accepted only there and on /Marti/api/tls/*,
# never for the admin UI or the Marti API. Turn this off if nothing needs them.
client_passwords_enabled = true
client_password_ttl = "90d"

# Whether /token/access may hand a caller its own access token (CloudTAK uses
# it to obtain a token it can present to other services).
allow_access_token_retrieval = true

# Where the first-run setup token is written, with mode 0600, when an
# installation has no administrator yet. Default: "<data_dir>/setup-token".
# setup_token_file = "setup-token"

# The AES-256 key sealing stored secrets, as base64 or hexadecimal. Generated
# into a file beside the database when absent. Rotated keys stay listed in
# previous_secret_keys until every record sealed with them has been rewritten.
# secret_key = "${{ env.RUSTAK_SECRET_KEY }}"
# previous_secret_keys = []

# The limiter on every endpoint that accepts a secret, keyed on the source
# address and the identity being attempted. It cannot be disabled: it is what
# stands between a client password and an offline guessing attack.
# rate_limit = { attempts = 10, window = "1m", lockout = "15m" }


# The OAuth2 clients GET /oauth/authorize will issue authorization codes to,
# and therefore what rustak publishes at /.well-known/openid-configuration.
# Empty by default, which switches the authorization-code flow off entirely: an
# authorization server with no registered client has nowhere legitimate to send
# a code. Register the browser clients that sign in through rustak — WebTAK-style
# pages, and CloudTAK once it ships an OIDC back end.
#
#   id            the `client_id` the client sends.
#   redirect_uris every URI a code may be delivered to, WRITTEN OUT IN FULL.
#                 Compared byte for byte, never as a prefix, and never a plain
#                 http:// address unless the host is a loopback one.
#   public        whether the client keeps no secret, which is every browser and
#                 mobile client. Default true. A public client MUST use proof
#                 key for code exchange with code_challenge_method=S256 and a
#                 request without one is refused. A confidential one
#                 (public = false) MUST carry a `secret` instead, authenticates
#                 at /oauth/token with client_secret_post or client_secret_basic,
#                 and may omit the proof key — which is what a standard OpenID
#                 relying party such as CloudTAK's SSO needs.
#   secret        the client secret, required when public = false and refused
#                 when public = true. Keep it out of this file with
#                 "${{ env.RUSTAK_OAUTH_CLIENT_SECRET }}"; it is redacted from
#                 every log line and never appears in a Debug dump.
#   post_logout_redirect_uris
#                 every URI GET|POST /logout?post_logout_redirect_uri= may send
#                 a browser back to for this client. Empty by default, which
#                 means a sign-out answers 204 and redirects nowhere. Held to
#                 the same rules as redirect_uris, and matched byte for byte.
#
# admin_group is the group name /oauth/userinfo reports for an administrator,
# beside the channels they hold, so a relying party can map admin rights by
# group. Rename it if a channel of your own is already called "admin".
#
# [auth.oauth]
# admin_group = "admin"
# clients = [
#   { id = "webtak", redirect_uris = ["https://tak.example.com/login/redirect.html"] },
#   { id = "cloudtak", redirect_uris = ["https://map.example.com/api/login/oidc/callback"], public = false, secret = "${{ env.RUSTAK_OAUTH_CLIENT_SECRET }}", post_logout_redirect_uris = ["https://map.example.com/"] },
# ]


# Federating with an identity provider. Unset by default; the whole section is
# optional, but endpoint, client_id and client_secret are required within it.
# [auth.oidc]
# endpoint = "https://id.example.com"
# client_id = "rustak"
# client_secret = "${{ env.RUSTAK_OIDC_CLIENT_SECRET }}"
#
# Scopes requested; "openid" is always added. Default:
# scopes = ["profile", "email", "offline_access"]
#
# The claim that becomes the rustak username (falling back to `sub`), and the
# claim listing group memberships. Choose a username claim that does not change.
# username_claim = "preferred_username"
# groups_claim = "groups"
#
# Group mapping. Only claimed groups starting with group_prefix are considered
# (empty considers all of them), and strip_group_prefix decides whether the
# prefix is removed from the resulting channel name. The suffixes follow the TAK
# convention: "ops_READ" grants read (OUT), "ops_WRITE" grants write (IN), and a
# bare "ops" grants both. Members of read_only_group never get write access.
# group_prefix = ""
# strip_group_prefix = true
# read_suffix = "_READ"
# write_suffix = "_WRITE"
# read_only_group = "observers"          # default: unset
#
# Whether a claimed group that does not exist yet is created.
# auto_create_groups = true
#
# Whether an account whose username matches an existing local user is linked to
# it on sign-in — the account keeps its passkeys, devices, channels and (as an
# explicit override) its administrative standing, and is the provider's from
# then on. Off by default: on, whoever controls the provider can take over an
# existing account by claiming its username. Somebody can always link their
# own account without this, from the Credentials page while signed in.
# link_by_username = false
#
# The name on the sign-in button. Default: the provider's URL.
# display_name = "Home SSO"


# The internal certificate authority. These settings are sticky: a device keeps
# the certificate and the truststore it enrolled with, so changing the CA means
# re-enrolling every device.
[pki]
ca_common_name = "rustak CA"

# The organisation (O) in every subject we issue. Ignored when name_entries is
# set, which replaces it wholesale.
organization = "rustak"

# The full, ordered list of relative distinguished names after the common name.
# [["O", "rustak"], ["OU", "EUD"]] issues CN=<user>,O=rustak,OU=EUD. Order is
# part of the subject's identity. "CN" is refused: the common name is the
# username the certificate identifies, and it is never taken from a request.
# Default: [] — the organization key above is used instead.
# name_entries = [["O", "rustak"], ["OU", "EUD"]]

# The key algorithm for the CA and the server certificates it issues; client
# keys are the client's own. "rsa-2048" | "rsa-3072" | "ecdsa-p256". RSA by
# default because TAK ecosystem truststores are conservative.
key_type = "rsa-2048"

ca_validity = "3650d"
client_cert_validity = "365d"

# 397 days is the longest a public authority will issue for, kept here so an
# internal certificate and a public one expire on the same rhythm.
server_cert_validity = "397d"
server_cert_renew_before = "30d"

# Extra names and addresses for the internal server certificate. [server]
# domains and [acme] domains are included automatically; these are for names
# only reachable on the local network, and for clients configured by address.
# server_names = ["tak.lan"]
# server_ips = ["192.168.1.10"]

# Whether a certificate must be one we have a record of, beyond chaining to our
# CA. On, so that deleting a certificate stops it working immediately.
require_known_cert = true

# The smallest RSA key accepted in a signing request, and whether an
# elliptic-curve request is accepted. csr_min_rsa_bits cannot be lowered below
# 2048: a certificate issued from a weak key outlives the change that allowed it.
csr_min_rsa_bits = 2048
csr_allow_ecdsa = true

# The passphrase on the PKCS#12 bundles produced for manual enrollment, and
# whether they are written with the legacy algorithms (3DES, SHA-1 MAC) that
# ATAK's keystore reads. "atakatak" is the passphrase every TAK client tries.
p12_password = "atakatak"
p12_legacy = true

# Whether issued client certificates carry the TAK channels marker EKU OID.
channels_marker_eku = true


# The public certificate for [web.public], when tls.mode = "acme". The two
# switches must agree: enabling one without the other is refused.
[acme]
enabled = false

# "letsencrypt" | "letsencrypt-staging" | an https:// directory URL. Test a
# deployment against staging first: production rate limits are unforgiving.
directory = "letsencrypt"

# The contact the authority warns about expiring certificates. An email address
# or a mailto: URI; both are accepted. Default: unset.
# contact = "ops@example.com"

# The authority's terms of service must be accepted before an order is placed.
# rustak does not accept somebody else's terms on your behalf.
accept_tos = false

# The names to request. Default: [] — [server] domains is used.
# domains = ["tak.example.com"]

# How the authority verifies that we control those names:
#   "tls-alpn-01" — answered in the TLS handshake on port 443, so ":443" must be
#                   in [web.public] listen. Needs no plaintext port.
#   "http-01"     — answered over plaintext HTTP on port 80, at
#                   /.well-known/acme-challenge/. rustak serves that path on
#                   every [web.public] listen address and on [web.public]
#                   plain_bind, so port 80 has to reach one of them: add ":80"
#                   to listen, set plain_bind = ":80", or set plain_bind to a
#                   higher port with a proxy forwarding :80 to it.
# Validation refuses a combination the authority could never complete, and
# refuses a wildcard name: that needs a dns-01 challenge, which rustak does not
# implement — list the concrete host names instead.
challenge = "tls-alpn-01"
renew_before = "30d"


# How long things are kept. Where an age and a cap are both given, both are
# enforced: an age alone lets a busy installation fill the disk inside the
# window, and a cap alone lets a quiet one keep data indefinitely. Caps are per
# device or per account, so one noisy source cannot evict everybody else.
[retention]
# CoT history. Whole segment files are pruned, so the effective horizon is this
# plus the tail of the segment that spans it.
cot_history = "7d"
# The most frames kept for any one device, enforced the same way and with the
# same rounding. 0 means no cap rather than "keep nothing": an installation
# that wants no history sets [stream.limits] record_history = false.
cot_history_max_rows = 2000000

audit = "90d"
audit_max_entries = 100000

archived_missions = "30d"

# How long a deleted mission keeps answering `410 Gone` before its row, its
# change history and its subscriptions are removed for good. The `410` is what
# tells a client holding a stale Data Sync that the mission was removed rather
# than that it is looking in the wrong place, which stops mattering once every
# client has noticed.
missions_purge_after = "14d"

# How long a stored blob that nothing refers to is kept. Not zero: an upload is
# referenced a moment after it is stored, and a collector running in between
# would delete the file out from under the request that wrote it. The hourly
# content-orphan job also sweeps partly written uploads out of <content_dir>/tmp
# on the same horizon.
content_orphans = "24h"


# Background housekeeping: the queue consumer that runs the retention sweeps,
# the ACME renewal, the content-orphan collector and the WAL checkpoint.
[jobs]
# How many times a failing message is retried before it is moved to the
# 'jobs/dead-letters' key-value partition with the error that ended it and
# stops being run. With the host's doubling backoff, ten attempts is a little
# over an hour of trying. 0 retries for ever, which is what this replaced.
max_attempts = 10

# How many jobs may run at once. The work is almost entirely writes against the
# single SQLite writer connection, so more in flight buys nothing and costs the
# web API its turn.
concurrency = 4
