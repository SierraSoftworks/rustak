<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Sierra Softworks" />
    <meta
      name="description"
      content="rustak is a lightweight, self-hosted TAK server admin console."
    />
    <title>rustak | Sierra Softworks</title>
    <!-- The favicon is the project mark from docs/assets, copied into dist by
         Trunk so the server embeds it beside the bundle. -->
    <link data-trunk rel="copy-file" href="../docs/assets/logo.svg" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <meta name="color-scheme" content="light dark" />
    <!-- Written by build.rs from the yewi-fonts crate and staged by the
         post_build hook in Trunk.toml. -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <!-- Apply the stored theme before anything paints (yewi::THEME_SCRIPT),
         so somebody who chose a theme is never flashed with the other one
         while the bundle loads. -->
    <script>
      (function(){try{var t=localStorage.getItem("yewi-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}})()
    </script>
    <link data-trunk rel="scss" href="styles.scss" />
    <link data-trunk rel="rust" data-bin="rustak-ui" />
  </head>
  <body></body>
</html>
