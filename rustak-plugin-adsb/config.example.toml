# rustak-plugin-adsb configuration.
#
# Every key is shown with its default. A key that is commented out has its
# default written beside it; a key that is shown uncommented is set to its
# default, so this file describes a working sidecar as it stands.
#
# Any value may be written as "${{ env.NAME }}", which is substituted from the
# environment (or from the file passed to --env) before the file is parsed. That
# is how a feed's API credentials stay out of a file you commit or bind-mount.
#
# Unknown and misplaced keys are refused rather than ignored, so
# `rustak-plugin-adsb --config config.example.toml --check` is a real check of
# this file. This crate's test suite loads it, so it cannot drift from the code
# either.
#
# Durations are written as "45s", "15m", "12h" or "30d".


[service]
# The service's name. Required: the stream uid (SERVICE-<name>), the control-API
# path and the certificate subject are all derived from it. One receiver per
# site is one name each: "adsb-heathrow", "adsb-gatwick".
name = "adsb"

# What to call this service in the admin UI. Default: its name.
# display_name = "ADS-B (Heathrow)"

# What this service advertises that it does. Default: [].
capabilities = ["cot.publish"]

# The token this service authenticates to /api/v1/services/* with. Default:
# none. It is a credential, so it belongs in the environment rather than here.
# token = "${{ env.RUSTAK_SERVICE_TOKEN }}"

# The one-time enrolment token this service gets its first certificate with,
# for the start where it has none. Default: none — and RUSTAK_ENROLLMENT_TOKEN
# in the environment does the same thing without editing this file. The private
# key is generated inside this process and never leaves it; the token is spent
# by the enrolment it pays for, so it is needed once rather than on every start,
# and one that is still set when the certificate exists is ignored.
# enrollment_token = "${{ env.RUSTAK_ENROLLMENT_TOKEN }}"

# The identity this sidecar's orchestrator already gave it, which buys both the
# certificate and the control-API token — so a deployment under Nomad or
# Kubernetes holds **no rustak secret at all**: no enrolment token to mint and
# hand over, no service token to copy into a file.
#
# Unset — the default — looks in three places, and **every file comes before
# the environment**:
#
#   1. ${NOMAD_SECRETS_DIR}/nomad_rustak.jwt          (Nomad, `file = true`)
#   2. /var/run/secrets/tokens/rustak                 (a Kubernetes projected
#                                                      serviceAccountToken)
#   3. the NOMAD_TOKEN_rustak environment variable   (Nomad, `env = true`),
#                                                      and only when there is
#                                                      no file
#
# That order is the renewal rule. Both orchestrators renew a workload identity
# by **rewriting its file**: Nomad's client re-signs at about half the ttl, the
# kubelet rewrites the projected volume. The environment variable is a copy
# taken when the process started and is never touched again, so a sidecar that
# preferred it would hold a credential with an hour to live and no way to get
# another — which is exactly how a control link died two hours after every
# start. Write `env = false, file = true` in the Nomad `identity` block.
#
# Set this to name exactly one source outright — exactly one, and naming both is
# refused. A source named here that holds nothing is a start-up failure rather
# than a quiet fall-back to the enrolment token: naming one is deliberate. An
# `env` source is honoured and warned about, because it cannot be renewed.
#
# The token is re-read from its source every time it is used, and this end
# reads its `exp` before presenting it, so a renewal in progress is waited for
# rather than presented half-written. The server side is `[auth.workload]`; see
# "Workload identity" in docs/deployment.md for the jobspec and the rules.
# workload_identity = { file = "/var/run/secrets/tokens/rustak" }
# workload_identity = { env = "NOMAD_TOKEN_rustak" }   # cannot be renewed

# The client certificate and private key this service opens the CoT stream with,
# in PEM. Default: none; both are required as soon as [server] stream names an
# "ssl://" endpoint, which every real deployment does. Files that are not there
# yet are what self-enrolment writes on the first start.
# certificate = "/etc/rustak/adsb.pem"
# key = "/etc/rustak/adsb.key"

# Where self-enrolment writes the certificate, key and truststore that the three
# settings around this one do not name. Default: the directory this file is in.
# pki_dir = "/etc/rustak"

# The account this service enrols and signs in as, which is the common name of
# the certificate it is issued. Default: the service's name above.
# account = "svc.adsb"

# The truststore used to verify the server's certificate, in PEM. Default: the
# platform's own roots — or, once this sidecar has enrolled, the CA chain the
# server answered the enrolment with, which is what an internal CA needs.
#
# It *replaces* the platform's roots for the CoT stream and [server] marti,
# which always present rustak's own CA, and *joins* them for [server] control,
# which may present an ACME or otherwise publicly trusted certificate instead.
# truststore = "/etc/rustak/truststore.pem"

# The truststore that verifies [server] control alone, in PEM. Default: unset —
# the platform's roots joined with `truststore` above, which covers both a
# publicly trusted public listener and one behind rustak's own CA.
#
# Set it only to *pin* the public listener to a PKI of your own: it replaces
# both the platform's roots and `truststore` for that endpoint, and says nothing
# about the stream or Marti. Nothing writes it, and a deployment whose public
# listener holds an ACME certificate needs it not at all.
# control_truststore = "/etc/rustak/public-ca.pem"


[server]
# The CoT stream, as a TAK connect string. Default: none — and a sidecar without
# one runs its ticks and opens no connection at all, which is what makes this
# file usable offline.
# stream = "ssl://tak.example.com:8089"

# The service control API, which is what registers this sidecar and reports its
# health to the admin UI. Default: none.
# control = "https://tak.example.com:8446"


[sidecar]
# How often the feed is polled and the publisher drained. The first tick happens
# as soon as the sidecar has started. Default: "30s" — this file sets it lower
# because ADS-B positions arrive about once a second and a longer tick would
# hold them back.
tick = "5s"

# How long `stop` is given before the harness stops waiting.
shutdown_grace = "10s"


[settings]
# What these tracks are to an operator: "unknown", "friend", "neutral",
# "hostile" or "pending". Default: "unknown" — open ADS-B says nothing about
# whose side an airframe is on, and a plugin that claimed otherwise would be
# putting an assertion on the map that nothing in the data supports.
affiliation = "unknown"

# Which MIL-STD-2525 symbol code each track carries beside its CoT type: "none",
# "2525c" or "2525d". Default: "none" — the type alone, which every client can
# draw. A device draws a bare type from its 2525C tables whatever edition it is
# set to, so a fleet on 2525D sets "2525d" to have these tracks drawn in the
# edition its own markers are. The code travels in <__milicon id> (and, for
# 2525C, <__milsym id> as well), which is what ATAK 5 writes itself.
symbology = "none"


# Where this feed is looking. The source subscribes with it and the publisher
# re-checks it, so an aggregator that rounds a radius upwards does not fill a
# channel with the whole of southern England. Default: the whole world.
#
# Either a circle, which is what an aggregator's point endpoint takes:
[settings.area]
kind = "circle"
lat = 51.4775
lon = -0.4614
radius_km = 120.0

# …or a box, which is what OpenSky's states/all takes:
# [settings.area]
# kind = "bbox"
# south = 50.5
# west = -2.0
# north = 52.5
# east = 1.0


# How often an aircraft may be republished, and how long one lives on a map.
#
# Every key here has a default of its own, and a table that omits one gets that
# default rather than this plugin's — which is why `stale` is written out below
# rather than left to be filled in.
[settings.publish]
# How long a published track stays on a map without another report. Default for
# this plugin: "90s". An aircraft reports about once a second, so one that has
# said nothing for ninety seconds has left the area, landed, or was never really
# there. No delete message is ever sent — TAK clients expire a track by this
# attribute, so a sidecar that is stopped leaves a map that empties itself.
stale = "90s"

# The shortest gap between two publications of the same aircraft, however far it
# moved. Default: "5s" — an airliner covers a kilometre and a half in that time,
# which is as often as anybody needs to see it move.
min_interval = "5s"

# The longest an aircraft that is still being reported goes unpublished. This is
# what keeps a holding aircraft on the map. Default: "60s".
max_interval = "60s"

# How far an aircraft must move since its last publication to be published
# again, in metres. Default for this plugin: 50 — an airliner at cruise covers
# 25 m in a tenth of a second, so the module's 25 would publish at the rate the
# receiver hears rather than at the rate anybody needs.
min_move_m = 50.0

# How many aircraft this sidecar holds before it drops the least recently seen.
# A busy 250 nm circle is a few hundred, so this is a ceiling on a runaway area
# rather than a working limit. Default: 5000.
max_tracks = 5000


# Where the observations come from. Required. Exactly one of the four blocks
# below, chosen with `kind`.
#
# This file ships with "replay" so that it runs with no receiver, no account and
# no internet; a deployment replaces this block with one of the three live ones.
# Read rustak-plugin-adsb/README.md first: every live source has terms, and two
# of the three ask for attribution.


# 1. A readsb / dump1090 receiver's own aircraft.json. The best source there is
#    and the only one with no terms: it is your own hardware, hearing aircraft
#    directly. `url_or_path` is either a file on this machine or an http:// or
#    https:// URL — tar1090 and the dump1090 web interfaces serve the document
#    at <base>/data/aircraft.json.
#
# [settings.source]
# kind = "readsb"
# url_or_path = "/run/readsb/aircraft.json"
# url_or_path = "http://receiver.lan/data/aircraft.json"
#
# How often to read it. Default: "1s" — readsb rewrites the file about once a
# second, and it is your own machine. The sidecar's own `tick` is the other
# half: a source is never read more often than a tick.
# poll = "1s"


# 2. A public aggregator, which pools what thousands of receivers hear. The area
#    above becomes the circle they are asked for, so keep it small: a 250 nm
#    circle over southern England is several hundred aircraft.
#
#    `provider` is one of:
#      "adsb_lol"       - open data, no account. https://adsb.lol
#      "adsb_fi"        - non-commercial use; asks to be cited and linked.
#                         https://adsb.fi
#      "airplanes_live" - EXPERIMENTAL: documented as the same shape, but our
#                         probe of the public endpoint was refused, so this path
#                         is implemented and unverified. https://airplanes.live
#
# [settings.source]
# kind = "aggregator"
# provider = "adsb_lol"
#
# How often to ask. Default: the provider's own, because the three services are
# not one service — "10s" for adsb_lol and airplanes_live, "5s" for adsb_fi.
#
# A value written here wins, clamped up to a floor of 2s whatever it says, and
# the clamp is logged at `info` rather than applied silently. These are free
# services run by volunteers; every request carries a user agent naming this
# plugin so that they can tell us to stop, and repeated 403s stop the source
# with a log line.
#
# It is a FLOOR, NOT A PIN. The source starts at this interval and never asks
# faster, but what the provider does can raise the interval actually in use:
#
#   - a 429 that says how long to wait (Retry-After, in whole or decimal seconds
#     or as an HTTP date) is waited out, and two of them inside ten polls make
#     that delay the interval until a restart;
#   - a 429 that names no delay — all adsb.lol has ever been seen to send — is
#     waited out on twice the interval, and two inside ten polls raise the
#     interval by half as much again (10s, 15s, 23s, 35s ... 120s at most).
#     Sixty polls in a row that nobody refused earn one step back down, towards
#     and never below the value written here.
#
# Each change is one line at `info`, and the start-up line says the interval may
# be raised. The heartbeat carries the cadence in use as source.poll_effective_s
# beside this one as source.poll_configured_s, and a count of 429s as
# source.rate_limited. Slowing down for a provider is reported `healthy`; being
# refused on more than half of the last twenty polls is `degraded`.
#
# adsb.lol's 10s is a starting point rather than a published figure: at "5s" it
# refused about every other request and at "10s" about one in five, without a
# Retry-After either time, so the source finds the rate it tolerates for itself.
# poll = "10s"


# 3. The OpenSky Network, which is a research network: its terms are research
#    and non-commercial use. The area above becomes the bounding box, and a box
#    larger than 25 square degrees costs more than one credit per request out of
#    a daily budget of 400 (anonymous) or 4000 (authenticated). The sidecar says
#    what your configuration costs at start-up.
#
# [settings.source]
# kind = "opensky"
#
# An OpenSky API client's credentials. Default: none, which is the anonymous
# tier. They are credentials, so they belong in the environment rather than
# here; create them under your OpenSky account.
# client_id = "${{ env.OPENSKY_CLIENT_ID }}"
# client_secret = "${{ env.OPENSKY_CLIENT_SECRET }}"
#
# How often to ask. Default: "10s" anonymously and "5s" with a credential, which
# are OpenSky's own two resolutions — asking faster returns the same numbers and
# spends the budget twice as fast. A floor rather than a pin, exactly as for an
# aggregator above: a 429 can raise the interval in use, never lower it.
# poll = "10s"


# 4. A file of tracks, offered on every tick: what this file ships with, what
#    the demonstration runs on, and what the integration suite drives. One JSON
#    track per line; see docs/plugins.md -> "Feed sidecars" for the fields.
[settings.source]
kind = "replay"
path = "tracks.example.ndjson"
