[package]
name = "rustak-plugin-adsb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "ADS-B feed sidecar: turns open aircraft-tracking data into CoT tracks on a rustak channel."

# A library as well as a binary, so that `rustak-server`'s integration suite can
# drive this plugin the way the harness does rather than shelling out to it.
[lib]
name = "rustak_plugin_adsb"
path = "src/lib.rs"

[[bin]]
name = "rustak-plugin-adsb"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
rustak-api = { workspace = true }
rustak-client = { workspace = true }
rustak-core = { workspace = true }
rustak-cot = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
human-errors = { workspace = true }
clap = { workspace = true }
# The live sources: every one of them is an HTTP GET of a JSON document, and
# OpenSky's is behind an OAuth2 client-credentials token exchange.
reqwest = { workspace = true }
serde_json = { workspace = true }
# Observation times, the `"90s"` durations in `[settings.source]`, and the age
# of a position report.
chrono = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# The source suites serve hand-written fixtures from a local mock rather than
# reaching a public aggregator: an open feed is somebody else's rate limit.
wiremock = { workspace = true }
