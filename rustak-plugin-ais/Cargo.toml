[package]
name = "rustak-plugin-ais"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "AIS feed sidecar: turns open vessel-tracking data into CoT tracks on a rustak channel."

# A library as well as a binary, so that `rustak-server`'s integration suite can
# drive this plugin the way the harness does rather than shelling out to it.
[lib]
name = "rustak_plugin_ais"
path = "src/lib.rs"

[[bin]]
name = "rustak-plugin-ais"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
rustak-client = { workspace = true }
rustak-core = { workspace = true }
rustak-cot = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
human-errors = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# The fixture test reads the demonstration file the example configuration names,
# and the reconnection test needs an observation time to offer.
serde_json = { workspace = true }
chrono = { workspace = true }
