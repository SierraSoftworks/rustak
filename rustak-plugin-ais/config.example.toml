# rustak-plugin-ais configuration.
#
# Every key is shown with its default. A key that is commented out has its
# default written beside it; a key that is shown uncommented is set to its
# default, so this file describes a working sidecar as it stands.
#
# Any value may be written as "${{ env.NAME }}", which is substituted from the
# environment (or from the file passed to --env) before the file is parsed. That
# is how a feed's API key stays out of a file you commit or bind-mount.
#
# Unknown and misplaced keys are refused rather than ignored, so
# `rustak-plugin-ais --config config.example.toml --check` is a real check of
# this file. This crate's test suite loads it, so it cannot drift from the code
# either.
#
# Durations are written as "45s", "15m", "12h" or "30d".


[service]
# The service's name. Required: the stream uid (SERVICE-<name>), the control-API
# path and the certificate subject are all derived from it. One AIS receiver per
# port is one name each: "ais-rotterdam", "ais-solent".
name = "ais"

# What to call this service in the admin UI. Default: its name.
# display_name = "AIS (Maas approach)"

# What this service advertises that it does. Default: [].
capabilities = ["cot.publish"]

# The token this service authenticates to /api/v1/services/* with. Default:
# none. It is a credential, so it belongs in the environment rather than here.
# token = "${{ env.RUSTAK_SERVICE_TOKEN }}"

# The one-time enrolment token this service gets its first certificate with,
# for the start where it has none. Default: none — and RUSTAK_ENROLLMENT_TOKEN
# in the environment does the same thing without editing this file. The private
# key is generated inside this process and never leaves it; the token is spent
# by the enrolment it pays for, so it is needed once rather than on every start,
# and one that is still set when the certificate exists is ignored.
# enrollment_token = "${{ env.RUSTAK_ENROLLMENT_TOKEN }}"

# The client certificate and private key this service opens the CoT stream with,
# in PEM. Default: none; both are required as soon as [server] stream names an
# "ssl://" endpoint, which every real deployment does. Files that are not there
# yet are what self-enrolment writes on the first start.
# certificate = "/etc/rustak/ais.pem"
# key = "/etc/rustak/ais.key"

# Where self-enrolment writes the certificate, key and truststore that the three
# settings around this one do not name. Default: the directory this file is in.
# pki_dir = "/etc/rustak"

# The account this service enrols and signs in as, which is the common name of
# the certificate it is issued. Default: the service's name above.
# account = "svc.ais"

# The truststore used to verify the server's certificate, in PEM. Default: the
# platform's own roots — or, once this sidecar has enrolled, the CA chain the
# server answered the enrolment with, which is what an internal CA needs.
# truststore = "/etc/rustak/truststore.pem"


[server]
# The CoT stream, as a TAK connect string. Default: none — and a sidecar without
# one runs its ticks and opens no connection at all, which is what makes this
# file usable offline.
# stream = "ssl://tak.example.com:8089"

# The service control API, which is what registers this sidecar, reports the
# feed's counters and connection state to the admin UI's Services page, and
# carries the optional server-side `area` override described below.
# Default: none.
# control = "https://tak.example.com:8446"


[sidecar]
# How often the feed is polled and the publisher drained. The first tick happens
# as soon as the sidecar has started. Default: "30s" — this file sets it lower
# because AIS position reports arrive every few seconds and a longer tick would
# hold them back. It is also what "degraded" is measured in: a source that has
# been reconnecting for more than two ticks says so on its heartbeat.
tick = "5s"

# How long `stop` is given before the harness stops waiting.
shutdown_grace = "10s"


[settings]
# What these tracks are to an operator: "unknown", "friend", "neutral",
# "hostile" or "pending". Default: "unknown" — open AIS says nothing about whose
# side a hull is on, and a plugin that claimed otherwise would be putting an
# assertion on the map that nothing in the data supports.
affiliation = "unknown"

# How long a vessel that is **under way** stays on a map without another report.
# Default: "2m". Anchored, moored and aground vessels get [settings.publish]
# stale instead, which is far longer, because they report only every few
# minutes; everything else is expected every few seconds and should disappear
# soon after it stops being heard.
#
# Raised to `max_interval + min_interval` when that is longer — a track whose
# staleness is shorter than the gap between two refreshes would drop off the map
# and come back — and the raise is logged at `info` when it happens. With the
# intervals below, an under-way vessel is published with a staleness of 3m05s.
under_way_stale = "2m"


# Where this feed is looking. The source subscribes with it and the publisher
# re-checks it, so an upstream that rounds a bounding box outwards does not fill
# a channel with the North Sea. Default: the whole world.
#
# An administrator may override this from the admin UI by setting an "area" key
# in the service's configuration (Services → this service → Configuration):
#
#     {"area": {"kind": "circle", "lat": 51.95, "lon": 4.13, "radius_km": 60}}
#
# Server-side configuration wins over this file and the substitution is logged
# at `info` on start-up, because the file is baked into a container image and
# the UI is where an area gets moved without a redeploy.
#
# Either a box:
[settings.area]
kind = "bbox"
south = 51.7
west = 3.6
north = 52.3
east = 4.7

# …or a circle, which is what most HTTP feeds take:
# [settings.area]
# kind = "circle"
# lat = 51.95
# lon = 4.13
# radius_km = 60.0


# How often a vessel may be republished, and how long an anchored one lives on a
# map.
#
# Note: a *partial* [settings.publish] table is filled in key by key from the
# shared PublishPolicy's own defaults ("2m" and "60s"), not from this plugin's,
# so every key is written out here rather than left to a default that a partial
# table would not reach.
[settings.publish]
# How long a published track stays on a map without another report — for
# anchored, moored and aground vessels; see `under_way_stale` above for the
# rest. Default: "10m", which suits a vessel at anchor: it reports every three
# minutes, `max_interval` below refreshes it well inside this, and a receiver
# that goes quiet leaves the hull on the map for ten minutes rather than for
# ever. No delete message is ever sent — TAK clients expire a track by this
# attribute, so a sidecar that is stopped leaves a map that empties itself.
stale = "10m"

# The shortest gap between two publications of the same vessel, however much it
# moved. Default: "5s".
min_interval = "5s"

# The longest a vessel that is still being reported goes unpublished. This is
# what keeps a moored ship on the map. Default: "3m".
max_interval = "3m"

# How far a vessel must move since its last publication to be published again,
# in metres. Default: 25.
min_move_m = 25.0

# How many vessels this sidecar holds before it drops the least recently seen.
# A ceiling on a runaway area rather than a working limit. It also bounds the
# per-MMSI name cache. Default: 5000.
max_tracks = 5000


# Where the observations come from. Required. Exactly one of the three below.
#
# ── kind = "replay" ──────────────────────────────────────────────────────────
# A file of tracks, offered on every tick. For demonstrations, for the
# integration suite, and for working on the plugin with no upstream at all.
[settings.source]
kind = "replay"
path = "tracks.example.ndjson"

# ── kind = "aisstream" ───────────────────────────────────────────────────────
# AISStream.io: worldwide AIS over a WebSocket, subscribed with the area above.
# A free API key from https://aisstream.io/account (shown once), and the terms
# published on that site. Three connections per account and per IP.
#
# The key is a credential: keep it in the environment, never in this file.
#
# [settings.source]
# kind = "aisstream"
# api_key = "${{ env.AISSTREAM_API_KEY }}"
#
# # Which message types to subscribe to. Default: the four below, which are the
# # ones that carry a position or a name.
# message_types = [
#     "PositionReport",
#     "ShipStaticData",
#     "StandardClassBPositionReport",
#     "ExtendedClassBPositionReport",
# ]

# ── kind = "udp" ─────────────────────────────────────────────────────────────
# NMEA 0183 !AIVDM sentences from a receiver of your own — AIS-catcher,
# rtl_ais, a dAISy hat, a transponder's network output. No key, no terms, and
# no internet: point the receiver's UDP output at this address.
#
# 127.0.0.1 takes datagrams from this host only, which is what a receiver in the
# same container or on the same machine should send to; 0.0.0.0 takes them from
# anywhere on the network, which means anyone on it can put a vessel on your
# map, so prefer a specific interface address.
#
# [settings.source]
# kind = "udp"
# listen = "127.0.0.1:10110"
