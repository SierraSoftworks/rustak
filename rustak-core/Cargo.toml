[package]
name = "rustak-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "Shared foundation for every rustak binary: config loading, telemetry bootstrap, human-errors prelude, credential/identity primitives, service-descriptor types."

